<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JYT — My Account</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070707;
  color:#f4efe7;
  font-family:Arial,Helvetica,sans-serif;
}

.close-btn{
  position:fixed;
  top:20px;
  right:25px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #333;
  border-radius:50%;
  background:#111;
  color:#f4efe7;
  font-size:30px;
  text-decoration:none;
  z-index:1000;
}

.close-btn:hover{
  background:#e9c58f;
  color:#111;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.logo{
  text-align:center;
  font-family:Georgia,serif;
  font-size:48px;
  font-weight:700;
}

.tag{
  text-align:center;
  color:#9c9c9c;
  margin-bottom:40px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:28px;
  margin-bottom:20px;
}

h1,h2,h3{margin-top:0}

input{
  width:100%;
  padding:14px;
  margin:7px 0 16px;
  border-radius:9px;
  border:1px solid #444;
  background:#090909;
  color:#fff;
  font-size:16px;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 20px;
  cursor:pointer;
  font-weight:700;
  font-size:15px;
}

.gold{
  background:#e9c58f;
  color:#111;
}

.dark{
  background:#222;
  color:#fff;
  border:1px solid #444;
}

.btn-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.muted{color:#999}

.error{
  color:#ff8585;
  margin-top:12px;
}

.success{
  color:#a8e6ad;
  margin-top:12px;
}

.order{
  border:1px solid #292929;
  background:#0b0b0b;
  border-radius:14px;
  padding:20px;
  margin-top:14px;
}

.order-id{
  font-weight:700;
  font-size:18px;
  margin-bottom:8px;
}

.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#252525;
  font-size:12px;
  font-weight:700;
  margin-right:5px;
}

.hidden{display:none}

.empty{
  text-align:center;
  color:#888;
  padding:30px 10px;
}

.upload-box{
  border:1px dashed #555;
  border-radius:14px;
  padding:25px;
  text-align:center;
  background:#0b0b0b;
}

.preview{
  max-width:100%;
  max-height:300px;
  border-radius:12px;
  margin:15px 0;
  display:none;
}

.progress{
  width:100%;
  height:8px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
  margin-top:15px;
  display:none;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#e9c58f;
}

a{
  color:#e9c58f;
  text-decoration:none;
}

@media(max-width:600px){
  .wrap{padding:25px 14px}
  .logo{font-size:40px}
}
</style>
</head>

<body>

<a href="index.html" class="close-btn">×</a>

<div class="wrap">

  <div class="logo">JYT</div>
  <div class="tag">JUST YOUR TYPE — WEAR WHAT DEFINES YOU.</div>

  <!-- LOGIN -->
  <div id="authBox" class="card">

    <h1>My Account</h1>

    <p class="muted">
      Login to view your orders and upload your design.
    </p>

    <label>Email</label>
    <input id="email" type="email" placeholder="Enter your email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password">

    <div class="btn-row">
      <button class="gold" onclick="login()">LOGIN</button>
      <button class="dark" onclick="register()">CREATE ACCOUNT</button>
    </div>

    <div id="authMsg"></div>

  </div>


  <!-- ACCOUNT -->
  <div id="accountBox" class="hidden">

    <div class="card">

      <h1>My Account</h1>

      <p class="muted">
        Logged in as <span id="userEmail"></span>
      </p>

      <button class="dark" onclick="logout()">LOG OUT</button>

    </div>


    <!-- CUSTOMER DESIGN UPLOAD -->
    <div class="card">

      <h2>Upload Your Design</h2>

      <p class="muted">
        Upload the design you want us to use for your JYT product.
      </p>

      <div class="upload-box">

        <input
          id="designFile"
          type="file"
          accept="image/png,image/jpeg,image/webp"
          onchange="previewDesign()"
        >

        <img id="preview" class="preview">

        <button
          id="uploadBtn"
          class="gold"
          onclick="uploadDesign()"
        >
          UPLOAD DESIGN
        </button>

        <div class="progress" id="progressBox">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="uploadMsg"></div>

      </div>

    </div>


    <!-- CUSTOMER DESIGNS -->
    <div class="card">

      <h2>My Uploaded Designs</h2>

      <div id="myDesigns">
        <div class="empty">Loading designs...</div>
      </div>

    </div>


    <!-- ORDERS -->
    <div class="card">

      <h2>Your Orders</h2>

      <div id="orders">
        <div class="empty">Loading orders...</div>
      </div>

    </div>

  </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDAmkpdcpG16BXKcS2lNU99frL0h8",
  authDomain: "just-your-type.firebaseapp.com",
  projectId: "just-your-type",
  storageBucket: "just-your-type.firebasestorage.app",
  messagingSenderId: "549453330593",
  appId: "1:549453330593:web:f7c76ab68b5e518fe518e0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();


auth.onAuthStateChanged(user => {

  if(user){

    document.getElementById("authBox").classList.add("hidden");
    document.getElementById("accountBox").classList.remove("hidden");

    document.getElementById("userEmail").textContent = user.email;

    loadOrders(user.uid);
    loadMyDesigns(user.uid);

  }else{

    document.getElementById("authBox").classList.remove("hidden");
    document.getElementById("accountBox").classList.add("hidden");

  }

});


async function register(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("authMsg");

  if(!email || !password){
    msg.className = "error";
    msg.textContent = "Please enter email and password.";
    return;
  }

  if(password.length < 6){
    msg.className = "error";
    msg.textContent = "Password must be at least 6 characters.";
    return;
  }

  msg.className = "muted";
  msg.textContent = "Creating account...";

  try{

    await auth.createUserWithEmailAndPassword(email,password);

    msg.className = "success";
    msg.textContent = "Account created successfully.";

  }catch(e){

    msg.className = "error";
    msg.textContent = e.message;

  }

}


async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("authMsg");

  if(!email || !password){

    msg.className = "error";
    msg.textContent = "Please enter email and password.";
    return;

  }

  msg.className = "muted";
  msg.textContent = "Signing in...";

  try{

    await auth.signInWithEmailAndPassword(email,password);

    msg.textContent = "";

  }catch(e){

    msg.className = "error";
    msg.textContent = e.message;

  }

}


function logout(){
  auth.signOut();
}


/* =========================
   DESIGN PREVIEW
========================= */

function previewDesign(){

  const file = document.getElementById("designFile").files[0];
  const preview = document.getElementById("preview");

  if(!file){
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}


/* =========================
   UPLOAD DESIGN
========================= */

function uploadDesign(){

  const user = auth.currentUser;
  const file = document.getElementById("designFile").files[0];

  const msg = document.getElementById("uploadMsg");
  const progressBox = document.getElementById("progressBox");
  const progressBar = document.getElementById("progressBar");
  const button = document.getElementById("uploadBtn");

  if(!user){
    msg.className = "error";
    msg.textContent = "Please login first.";
    return;
  }

  if(!file){
    msg.className = "error";
    msg.textContent = "Please select a design image.";
    return;
  }

  if(file.size > 10 * 1024 * 1024){
    msg.className = "error";
    msg.textContent = "Maximum file size is 10 MB.";
    return;
  }

  if(!file.type.startsWith("image/")){
    msg.className = "error";
    msg.textContent = "Only image files are allowed.";
    return;
  }

  button.disabled = true;
  msg.className = "muted";
  msg.textContent = "Uploading design...";

  progressBox.style.display = "block";
  progressBar.style.width = "0%";


  const safeName = file.name
    .replace(/[^a-zA-Z0-9._-]/g,"_");

  const fileName =
    Date.now() + "_" + safeName;

  const path =
    "customer-designs/" +
    user.uid +
    "/" +
    fileName;

  const storageRef = storage.ref(path);

  const uploadTask = storageRef.put(file);


  uploadTask.on(
    "state_changed",

    snapshot => {

      const progress =
        (snapshot.bytesTransferred /
        snapshot.totalBytes) * 100;

      progressBar.style.width =
        progress + "%";

    },

    error => {

      console.error(error);

      button.disabled = false;
      progressBox.style.display = "none";

      msg.className = "error";
      msg.textContent =
        "Upload failed: " + error.message;

    },

    async () => {

      try{

        const downloadURL =
          await uploadTask.snapshot
            .ref.getDownloadURL();

        await db.collection("customerDesigns").add({

          userId: user.uid,

          userEmail: user.email,

          fileName: file.name,

          storagePath: path,

          downloadURL: downloadURL,

          contentType: file.type,

          size: file.size,

          status: "PENDING",

          createdAt: firebase.firestore.FieldValue.serverTimestamp()

        });


        button.disabled = false;

        progressBox.style.display = "none";

        msg.className = "success";
        msg.textContent =
          "Design uploaded successfully!";

        document.getElementById("designFile").value = "";

        document.getElementById("preview").style.display = "none";

        loadMyDesigns(user.uid);

      }catch(e){

        console.error(e);

        button.disabled = false;

        progressBox.style.display = "none";

        msg.className = "error";
        msg.textContent =
          "Upload completed but saving design failed: " +
          e.message;

      }

    }
  );

}


/* =========================
   LOAD CUSTOMER DESIGNS
========================= */

async function loadMyDesigns(uid){

  const box =
    document.getElementById("myDesigns");

  box.innerHTML =
    '<div class="empty">Loading designs...</div>';

  try{

    const snap = await db
      .collection("customerDesigns")
      .where("userId","==",uid)
      .get();

    if(snap.empty){

      box.innerHTML =
        '<div class="empty">No designs uploaded yet.</div>';

      return;

    }

    let designs = [];

    snap.forEach(doc => {

      designs.push({
        id: doc.id,
        ...doc.data()
      });

    });

    designs.sort((a,b) => {

      const aTime =
        a.createdAt?.toMillis
        ? a.createdAt.toMillis()
        : 0;

      const bTime =
        b.createdAt?.toMillis
        ? b.createdAt.toMillis()
        : 0;

      return bTime - aTime;

    });


    box.innerHTML = designs.map(d => `

      <div class="order">

        <img
          src="${escapeHtml(d.downloadURL || "")}"
          style="
            max-width:100%;
            max-height:250px;
            border-radius:12px;
            display:block;
            margin-bottom:15px;
          "
        >

        <b>${escapeHtml(d.fileName || "Design")}</b>

        <p>
          <span class="pill">
            ${escapeHtml(d.status || "PENDING")}
          </span>
        </p>

      </div>

    `).join("");

  }catch(e){

    console.error(e);

    box.innerHTML =
      '<div class="error">Could not load designs: ' +
      escapeHtml(e.message) +
      '</div>';

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(uid){

  const box = document.getElementById("orders");

  box.innerHTML =
    '<div class="empty">Loading orders...</div>';

  try{

    const snap = await db
      .collection("orders")
      .where("userId","==",uid)
      .get();

    if(snap.empty){

      box.innerHTML =
        '<div class="empty">No orders found for this account.</div>';

      return;

    }

    let orders = [];

    snap.forEach(doc => {

      orders.push({
        id:doc.id,
        ...doc.data()
      });

    });

    orders.sort((a,b) => {

      const aTime = a.createdAt?.toMillis
        ? a.createdAt.toMillis()
        : 0;

      const bTime = b.createdAt?.toMillis
        ? b.createdAt.toMillis()
        : 0;

      return bTime - aTime;

    });


    box.innerHTML = orders.map(o => {

      const orderId = o.orderId || o.id;
      const status = o.status || "NEW";
      const payment = o.paymentStatus || "PENDING";
      const product = o.product || {};

      return `

        <div class="order">

          <div class="order-id">
            ${escapeHtml(orderId)}
          </div>

          <span class="pill">
            STATUS: ${escapeHtml(status)}
          </span>

          <span class="pill">
            PAYMENT: ${escapeHtml(payment)}
          </span>

          <p class="muted">
            ${escapeHtml(product.type || "CUSTOM T-SHIRT")}
            ·
            ${escapeHtml(product.colour || "")}
            ·
            ${escapeHtml(product.size || "")}
          </p>

          <p>
            Total:
            <b>₹${escapeHtml(
              String(product.totalAmount || 0)
            )}</b>
          </p>

          <a href="track.html?order=${encodeURIComponent(orderId)}">
            TRACK THIS ORDER →
          </a>

        </div>

      `;

    }).join("");

  }catch(e){

    box.innerHTML =
      '<div class="error">Could not load orders: ' +
      escapeHtml(e.message) +
      '</div>';

  }

}


function escapeHtml(v){

  return String(v ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}

</script>

</body>
</html>
